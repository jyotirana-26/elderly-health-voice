<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sāthī — Daily Voice Health Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="script.js">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">🩺</div>
      <div>
        <h1>Sāthī</h1>
        <div class="sub">Daily voice health check-in</div>
      </div>
    </div>
    <div class="today" id="todayLabel"></div>
  </header>

  <div class="banner" id="alertBanner" role="alert">
    <span aria-hidden="true">⚠️</span>
    <div>
      <strong>A few recent check-ins looked less steady than usual.</strong>
      <span id="alertDetail">Consider mentioning this to a doctor, or notify a family member below.</span>
    </div>
  </div>

  <section class="hero">
    <h2>How's your breathing today?</h2>
    <p class="lead">Sit somewhere quiet, hold the phone about a hand's width from your mouth, and breathe normally for 25 seconds. No need to talk.</p>

    <div class="ring-wrap">
      <canvas id="ringCanvas" width="170" height="170"></canvas>
    </div>

    <button class="mic-btn" id="micBtn" aria-label="Start 25 second voice check-in">
      <span id="micIcon" aria-hidden="true">🎙️</span>
    </button>
    <div class="status-line" id="statusLine">Tap the microphone to begin</div>
  </section>

  <div class="card alert-card">
    <h3>🚨 In case of concern</h3>
    <div class="card-sub">One tap emails everyone in your care circle with your latest reading. Their phone numbers appear below so you can call right away.</div>
    <button class="big-alert-btn" id="alertBtn">🚨 Alert my care circle now</button>
    <div class="call-chip-row" id="quickCallRow"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>30-day trend</h3>
      <div class="card-sub">Breathing regularity score from each check-in</div>
      <canvas id="trendChart"></canvas>
    </div>

    <div class="card">
      <h3>Today's snapshot</h3>
      <div class="card-sub" id="snapshotDate">No check-in yet today</div>
      <div class="snapshot-row">
        <span class="label">Est. breathing rate</span>
        <span class="value" id="snapRate">—</span>
      </div>
      <div class="snapshot-row">
        <span class="label">Regularity</span>
        <span class="value" id="snapRegularity">—</span>
      </div>
      <div class="snapshot-row">
        <span class="label">Trend vs last week</span>
        <span class="value" id="snapTrend">—</span>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <h3>Check-in history</h3>
    <div class="card-sub">Last 30 recorded entries, newest first</div>
    <div id="historyWrap">
      <p class="empty-state">Your check-ins will appear here once you record your first one.</p>
    </div>
    <div class="btn-row">
      <button class="btn" id="exportBtn">⬇ Export as CSV</button>
      <button class="btn" id="clearBtn">Clear all data</button>
    </div>
  </div>

  <div class="card">
    <h3>Care circle</h3>
    <div class="card-sub">Add a family member or doctor to notify with one tap</div>

    <ul class="contact-list" id="contactList"></ul>

    <form class="contact-form" id="contactForm">
      <input type="text" id="contactName" placeholder="Name (e.g. Priya, daughter)" required>
      <input type="email" id="contactEmail" placeholder="Email address" required>
      <input type="tel" id="contactPhone" placeholder="Phone number (optional)">
    </form>
    <div class="btn-row">
      <button class="btn primary" id="addContactBtn">+ Add to care circle</button>
    </div>
  </div>

  <div class="card">
    <h3>Medicine & pharmacy</h3>
    <div class="card-sub">Find a pharmacy nearby, or go straight to an online pharmacy for home delivery.</div>
    <div class="btn-row">
      <button class="btn primary" id="findPharmacyBtn">📍 Find nearby pharmacy</button>
    </div>
    <div class="pharmacy-links">
      <a class="btn" href="https://www.1mg.com" target="_blank" rel="noopener">Order on Tata 1mg</a>
      <a class="btn" href="https://pharmeasy.in" target="_blank" rel="noopener">Order on PharmEasy</a>
      <a class="btn" href="https://www.netmeds.com" target="_blank" rel="noopener">Order on Netmeds</a>
      <a class="btn" href="https://blinkit.com" target="_blank" rel="noopener">Order on Blinkit (fast delivery)</a>
    </div>
    <p class="fine-note">These links open the pharmacy's own site or app, where you enter your address, add a prescription if needed, and complete the order yourself — Sāthī doesn't place orders or handle payments on your behalf.</p>
  </div>

  <footer>
    <p class="disclaimer">Sāthī gives a rough, at-home sense of how steady your breathing sounds from day to day — it is <strong>not</strong> a medical device and does not diagnose any condition, including irregular heartbeat, sleep apnea, or lung disease. Readings are estimates from your device's microphone only. If you feel unwell, or a reading concerns you, please contact a doctor rather than relying on this app. The alert button sends an email and shows saved phone numbers for you to call — it cannot dial or message anyone by itself, and in a real emergency please call your local emergency number directly. The pharmacy and delivery links open other companies' own sites or apps; Sāthī does not place orders, handle prescriptions, or process payments. All check-in data stays on this device in your browser and is not sent anywhere by this app.</p>
  </footer>
</div>
</body>
</html>
